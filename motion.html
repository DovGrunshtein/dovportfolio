<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Sections</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mediaqueries.css" media="print" onload="this.media='all'" />
    <style>
      .logo a {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <!-- DESKTOP NAV -->
    <nav id="desktop-nav">
      <div class="logo"><a href="index.html">Dov Grunshtein</a></div>
      <div>
        <ul class="nav-links">
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#experience">Knowledge</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </div>
    </nav>

    <!-- HAMBURGER NAV -->
    <nav id="hamburger-nav">
      <div class="logo"><a href="index.html">Dov Grunshtein</a></div>
      <div class="hamburger-menu">
        <div class="hamburger-icon" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="menu-links">
          <li><a href="index.html#about" onclick="toggleMenu()">About</a></li>
          <li><a href="index.html#experience" onclick="toggleMenu()">Knowledge</a></li>
          <li><a href="index.html#projects" onclick="toggleMenu()">Projects</a></li>
          <li><a href="index.html#contact" onclick="toggleMenu()">Contact</a></li>
        </div>
      </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="#motion">MOTION</a></li>
      </ul>
    </div>

    <!-- SECTIONS -->
    <section id="motion" class="project-section">
      <h2 class="section-title">MOTION</h2>
      <div class="video-row horizontal" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; justify-items: center;">
        <div class="video-thumbnail youtube-thumbnail horizontal" data-youtube-id="O6Ajb2t88pA">
          <img src="https://img.youtube.com/vi/O6Ajb2t88pA/hqdefault.jpg" alt="Motion Graphic 1" loading="lazy" />
        </div>
        <div class="video-thumbnail youtube-thumbnail horizontal" data-youtube-id="f6VL4meYpow">
          <img src="https://img.youtube.com/vi/f6VL4meYpow/maxresdefault.jpg" alt="Motion Graphic 2" loading="lazy" />
        </div>
        <div class="video-thumbnail youtube-thumbnail horizontal" data-youtube-id="VgLbjTJIjnQ">
          <img src="https://img.youtube.com/vi/VgLbjTJIjnQ/maxresdefault.jpg" alt="Motion Graphic 3" loading="lazy" />
        </div>
      </div>
    </section>

    <!-- POPUP -->
    <!-- Video Popup -->
    <div id="video-popup-overlay">
      <div class="video-popup-container">
        <video id="popup-video" controls preload="none">
          Your browser does not support the video tag.
        </video>
        <button class="close-popup" onclick="closeVideoPopup()">&times;</button>
      </div>
    </div>

    <!-- YouTube Popup -->
    <div id="youtube-popup-overlay">
      <div class="youtube-popup-container">
        <iframe id="popup-youtube" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
        <button class="close-popup" onclick="closeYouTubePopup()">&times;</button>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
