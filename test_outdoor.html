<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Outdoor Images</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-image { width: 200px; height: 200px; object-fit: cover; margin: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Testing Outdoor Images</h1>
    
    <h2>Testing Thumbnails:</h2>
    <div id="thumbnails">
        <img src="thumbnails/images/_MG_7403_1_thumb.jpg" alt="Test 1" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
        
        <img src="thumbnails/images/_MG_0015_thumb.jpg" alt="Test 2" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
        
        <img src="thumbnails/images/_MG_7675_thumb.jpg" alt="Test 3" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
    </div>
    
    <h2>Testing Full Images:</h2>
    <div id="full-images">
        <img src="images/Outdoor/_MG_7403_1.jpg" alt="Test 1 Full" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
        
        <img src="images/Outdoor/_MG_0015.jpg" alt="Test 2 Full" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
        
        <img src="images/Outdoor/_MG_7675.jpg" alt="Test 3 Full" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
    </div>
    
    <h2>Testing Other Sections (for comparison):</h2>
    <div id="other-sections">
        <img src="thumbnails/images/DSC09634-Edit_thumb.jpg" alt="Vesogia Test" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
        
        <img src="thumbnails/images/DSC01051-Edit_thumb.jpg" alt="Especie Test" class="test-image" onload="this.nextElementSibling.textContent='✓ Loaded'" onerror="this.nextElementSibling.textContent='✗ Failed to load'" />
        <span class="status"></span><br>
    </div>
</body>
</html>
